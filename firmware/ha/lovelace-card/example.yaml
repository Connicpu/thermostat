# Connie thermostat V3 card. Minimal: the card finds the device and all its entities itself.
type: custom:connie-thermostat-card

# --- everything below is optional ---
# device_id: 0123456789abcdef0123456789abcdef   # pick it in the visual editor; default = first Connie thermostat-v3
# name: Thermostat
# show_schedule: true
# show_morning_boost: true
# show_manual_boost: true
# show_status: true
# collapsed: [status]                           # sections that start closed (default: status)
# entities:                                     # override any auto-discovered entity
#   climate: climate.connie_thermostat_v3
#   humidity: sensor.hallway_humidity
#   day_heat_temp: number.connie_thermostat_v3_day_heating_temperature
